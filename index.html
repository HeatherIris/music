<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Music Player</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="wrapper">
        <div class="player-card">
            <div class="img-wrapper">
                <div class="song-img">
                    <img alt="">
                </div>
            </div>
            <div class="song-info">
                <div class="song-name">茎</div>
                <div class="singer-name">椎名林檎</div>
                <div class="album-name"></div>
            </div>
            <div class="process">
                <div class="pro-wrapper">
                    <div class="pro-bottom"></div>
                    <div class="pro-top">
                        <div class="slider-point"></div>
                    </div>
                </div>
                <div class="cur-time">00:00</div>
                <div class="all-time">--:--</div>
            </div>
            <div class="song-control">
                <div class="song-control-main">
                    <div class="btn prev-btn"></div>
                    <div class="btn play-btn"></div>
                    <div class="btn next-btn"></div>
                </div>
                <div class="list-btn" role="button" aria-label="Playlist"></div>
            </div>
        </div>
    </div>
    <script src="./js/zepto.min.js"></script>
    <script src="./js/gaussBlur.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/controlManager.js"></script>
    <script src="./js/audioManager.js"></script>
    <script src="./js/process.js"></script>
    <script src="./js/playlist.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
